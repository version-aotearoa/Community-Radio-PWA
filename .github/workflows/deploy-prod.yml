name: Deploy prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Svelte check
        run: npm run check
      - name: D1 migrations (prod)
        run: npx wrangler d1 migrations apply version-radio-db --remote
      - name: Build app
        run: npm run build
      - name: Deploy app to Pages (prod)
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name version-radio --branch main
      - name: Deploy chat worker (prod)
        working-directory: workers/chat-worker
        run: npx wrangler deploy
